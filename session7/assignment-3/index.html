<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>مواعيد اللقاءات | coderz</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="schedule-page">
        <header class="page-header">
            <h1>مواعيد اللقاءات</h1>
            <p>تابع لقاءاتك القادمة واستعد للتطبيق.</p>
        </header>

        <section class="meetings">

            <article class="meeting-card meeting-card--blue">
                <span class="meeting-badge">اللقاء القادم</span>

                <h2>أساسيات HTML</h2>

                <p class="meeting-description">
                    رتّب محتوى الصفحة واستخدم العناصر المناسبة.
                </p>

                <p class="meeting-time">
                    السبت - 10:00 صباحًا
                </p>

                <button class="meeting-button" type="button">
                    تفاصيل اللقاء
                </button>
            </article>

            <article class="meeting-card meeting-card--green">
                <span class="meeting-badge">الأسبوع القادم</span>

                <h2>تنسيق الصفحات باستخدام CSS</h2>

                <p class="meeting-description">
                    نسّق النصوص والألوان واضبط المسافات.
                </p>

                <p class="meeting-time">
                    الاثنين - 5:00 مساءً
                </p>

                <button class="meeting-button" type="button">
                    تفاصيل اللقاء
                </button>
            </article>

        </section>
    </main>

</body>

</html>
